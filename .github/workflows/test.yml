name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q __init__.py hermes_skill_publisher tests scripts
      - run: python scripts/check_public_repo.py

  hermes-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: d25e2dbdbc40b49808c0a0e9cfed21cc90cffab3 # v2026.7.30
          path: _hermes-agent
      - run: python -m pip install -e '.[test]' -e ./_hermes-agent
      - run: HERMES_AGENT_SOURCE="$PWD/_hermes-agent" python -m pytest -q tests/test_e2e_hermes.py

  hermes-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: main # Intentionally floating compatibility lane only.
          path: _hermes-agent
      - run: python -m pip install -e '.[test]' -e ./_hermes-agent
      - run: HERMES_AGENT_SOURCE="$PWD/_hermes-agent" python -m pytest -q tests/test_e2e_hermes.py
