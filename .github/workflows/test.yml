name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q __init__.py hermes_skill_publisher tests scripts
      - run: python scripts/check_public_repo.py

  hermes-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: d25e2dbdbc40b49808c0a0e9cfed21cc90cffab3 # v2026.7.30
          path: _hermes-agent
      - run: python -m pip install -e '.[test]' -e ./_hermes-agent
      - run: HERMES_AGENT_SOURCE="$PWD/_hermes-agent" python -m pytest -q tests/test_e2e_hermes.py

  hermes-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: main # Intentionally floating compatibility lane only.
          path: _hermes-agent
      - run: python -m pip install -e '.[test]' -e ./_hermes-agent
      - run: HERMES_AGENT_SOURCE="$PWD/_hermes-agent" python -m pytest -q tests/test_e2e_hermes.py
